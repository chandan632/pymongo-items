[project]
name = "items-api"
version = "0.3.0"
description = "FastAPI + MongoDB items API with auth, pagination, filtering, sorting, search, bulk actions, and export"
readme = "README.md"
authors = [
    { name = "chandan632", email = "chandanrout737@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.0.0",
    "fastapi>=0.141.1",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.0",
    "pymongo>=4.17.0",
    "redis>=5.2.0",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]

[project.scripts]
items-api = "items_api:main"
create-admin = "items_api.cli:create_admin_main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
packages = ["items_api"]

[tool.coverage.run]
source = ["items_api"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
