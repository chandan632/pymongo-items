services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: items
      MONGO_INITDB_ROOT_PASSWORD: items_secret
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "items",
          "-p",
          "items_secret",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional API container: docker compose --profile full up --build
  api:
    profiles: ["full"]
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      # Hostnames on the compose network (override localhost from .env.example)
      MONGO_URI: mongodb://items:items_secret@mongo:27017/?authSource=admin
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      ENVIRONMENT: production
      ALLOW_SEED: "false"
      COOKIE_SECURE: "true"
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-production-secret}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo_data:
